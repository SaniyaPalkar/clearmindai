
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ClearMind AI</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #100b20;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            background: #1d1533;
            border: 1px solid #49346f;
            border-radius: 18px;
        }

        h1 {
            color: #c4a5ff;
            text-align: center;
        }

        p {
            text-align: center;
            color: #b9aecb;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #574478;
            border-radius: 9px;
            background: #100b20;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 9px;
            background: #8957e5;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #7543cf;
        }

        a {
            color: #c4a5ff;
        }

        .message {
            color: #ffaaaa;
            text-align: center;
            margin: 10px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>💡 ClearMind AI</h1>
        <p>Welcome back! Login to continue.</p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>
        </form>

        <p>Don't have an account?
            <a href="{{ url_for('register') }}">Create Account</a>
        </p>
    </div>
</body>
</html>
